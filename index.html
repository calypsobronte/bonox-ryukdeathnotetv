*{margin:0;padding:0;box-sizing:border-box}
html,body{background:transparent;overflow:hidden}
body{display:flex;align-items:flex-start;height:100vh}

.bar{
  position:relative;display:flex;align-items:center;
  height:110px;padding:0 26px 0 20px;
  background:rgba(11,11,11,.92);
  clip-path:polygon(0 0, 100% 0, 100% 52%, 97% 100%, 0 100%);
  animation:in 800ms cubic-bezier(.16,1,.3,1) both;
}
.bar::before{content:"";position:absolute;left:0;top:0;bottom:0;width:7px;background:#E4FF00}

.logos{display:flex;align-items:center;gap:19px;flex:none}
.logos img{width:68px;height:68px;display:block}
.x{font:700 30px/1 Rajdhani;color:#7A7C72}
.rule{width:2px;height:62px;background:#3C3C37;margin:0 22px;flex:none}

.well{position:relative;flex:1;height:72px;min-width:330px}
.slide{
  position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;gap:1px;
  opacity:0;transform:translateY(9px);
  transition:opacity 440ms ease, transform 440ms cubic-bezier(.16,1,.3,1);
}
.slide.on{opacity:1;transform:none}
.eyebrow{font:700 15px/1 Rajdhani;letter-spacing:.28em;color:#E4FF00}
.main{position:relative;font:400 40px/1.05 Anton;color:#fff;white-space:nowrap;overflow:hidden}
.main.sm{font-size:27px}
.main em{font-style:normal;color:#E4FF00}
.slide.on .main::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(100deg,transparent 40%,rgba(228,255,0,.8) 50%,transparent 60%);
  mix-blend-mode:overlay;transform:translateX(-120%);
  animation:sweep 9s 2.2s ease-in-out infinite;
}

.track{position:absolute;left:0;bottom:0;height:3px;width:97%;background:#242420}
.fill{height:100%;width:0;background:#E4FF00}
.track.hide{display:none}

@keyframes in{from{opacity:0;transform:translateX(-34px)}to{opacity:1;transform:none}}
@keyframes sweep{0%,10%{transform:translateX(-120%)}22%,100%{transform:translateX(120%)}}
@media (prefers-reduced-motion:reduce){
  .bar{animation:none}
  .slide{transition:opacity 200ms ease;transform:none}
  .slide.on .main::after{animation:none;opacity:0}
}
</style>

<script>
const SEGUNDOS = 12;

const MENSAJES = [
  { arriba: "CÓDIGO DE CREADOR", abajo: "RYUKDEATHNOTETV" },
  { arriba: "COMPRA TUS VP EN",  abajo: "bonoxs.com/co/valorant-co", chico: true },
  { arriba: "PAGA CON",          abajo: "Nequi · Daviplata · Bancolombia", chico: true },
  { arriba: "APOYA EL CANAL",    abajo: "Usa mi código <em>al pagar</em>", chico: true }
];
/* ================================================================== */

const well = document.getElementById("well");
const fill = document.getElementById("fill");
const track = document.getElementById("track");

const slides = MENSAJES.map((m, i) => {
  const el = document.createElement("div");
  el.className = "slide" + (i === 0 ? " on" : "");
  el.innerHTML = '<div class="eyebrow">' + m.arriba + '</div>' +
                 '<div class="main' + (m.chico ? ' sm' : '') + '">' + m.abajo + '</div>';
  well.appendChild(el);
  return el;
});

if (slides.length < 2) {
  track.classList.add("hide");
} else {
  const ms = SEGUNDOS * 1000;
  let i = 0;
  const run = () => {
    fill.style.transition = "none";
    fill.style.width = "0%";
    void fill.offsetWidth;
    fill.style.transition = "width " + ms + "ms linear";
    fill.style.width = "100%";
  };
  run();
  setInterval(() => {
    slides[i].classList.remove("on");
    i = (i + 1) % slides.length;
    slides[i].classList.add("on");
    run();
  }, ms);
}
</script>
